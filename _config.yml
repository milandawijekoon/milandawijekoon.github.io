title: Milanda Wijekoon
tagline: Associate Technical Lead
description: >-
  Milanda Wijekoon — Associate Technical Lead building scalable SaaS and
  fintech platforms with PHP/Laravel, Vue.js, Node.js and AWS.
# Live site. When the custom domain (milandawijekoon.dev) is finalised,
# change this to "https://milandawijekoon.dev" and add a CNAME file.
url: "https://milandawijekoon.github.io"
baseurl: ""
lang: en_US

author:
  name: Milanda Wijekoon
  email: milandawijekoon@gmail.com
  linkedin: https://linkedin.com/in/milandawijekoon


# Used by jekyll-seo-tag for Person JSON-LD (sameAs) and default share image
social:
  name: Milanda Wijekoon
  links:
    - https://linkedin.com/in/milandawijekoon
    - https://github.com/milandawijekoon
logo: /assets/images/logo.png
image: /assets/images/logo.png

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logo.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
