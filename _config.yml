title: Milanda Wijekoon
tagline: Associate Technical Lead
description: >-
  Milanda Wijekoon — Associate Technical Lead building scalable SaaS and
  fintech platforms with PHP/Laravel, Vue.js, Node.js and AWS.
# Live site. When the custom domain (milandawijekoon.dev) is finalised,
# change this to "https://milandawijekoon.dev" and add a CNAME file.
url: "https://milandawijekoon.github.io"
baseurl: ""
lang: en_US

author:
  name: Milanda Wijekoon
  email: milandawijekoon@gmail.com
  linkedin: https://linkedin.com/in/milandawijekoon


# Used by jekyll-seo-tag for Person JSON-LD (sameAs) and default share image
social:
  name: Milanda Wijekoon
  links:
    - https://linkedin.com/in/milandawijekoon
    - https://github.com/milandawijekoon
logo: /assets/images/logo.png
image: /assets/images/logo.png

# Google AdSense. The site-wide meta tag (for ownership verification)
# renders once client is set. The loader script renders on blog post
# pages only (_layouts/post.html), so ads stay off every other page.
# The in-article ad slot stays dormant until in_article_slot is also
# filled in (create the ad unit in AdSense > Ads > By ad unit > In-feed
# or In-article, then paste its numeric slot ID here) — otherwise it
# renders a broken/empty ad request. Once approved, also fill in
# /ads.txt with the line AdSense gives you (Account > Sites > "View
# site" > ads.txt).
adsense:
  client: "ca-pub-6134797434918002"
  in_article_slot: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:title/

# Posts are dated by local (UTC+5:30) calendar day, but Jekyll's default
# future-post check compares against UTC. Without this, a post dated
# "today" can be silently excluded from the build for the first ~5.5
# hours of the local day, since UTC is still on the previous date.
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logo.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
