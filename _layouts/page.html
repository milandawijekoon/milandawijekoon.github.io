---
layout: default
---
<main id="top">
  <section class="page-hero outer">
    <div class="inner">
      {% if page.eyebrow %}<p class="page-eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
    </div>
  </section>

  <section class="section outer" style="padding-top:0;">
    <div class="inner">
      <div class="article-body" style="margin-top:0;">
        {{ content }}
      </div>
    </div>
  </section>
</main>
