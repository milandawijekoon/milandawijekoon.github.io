<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}" />
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
{% seo title=false %}
{% feed_meta %}
</head>
<body>
{% if page.layout == "post" %}<div id="reading-progress"></div>{% endif %}
<div class="viewport">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</div>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
